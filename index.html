<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Portal BI Harinera del Valle</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #eef2f7;
        }

        /* ===== HEADER ===== */

        header {
            background-color: #0033A0;
            padding: 12px 40px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        /* Franja verde inferior */
        header::after {
            content: "";
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 6px;
            background-color: #196B24;
        }

        .logo {
            height: 60px;
        }

        /* Título centrado real */
        .header-title {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-size: 22px;
            font-weight: bold;
        }

        /* ===== Selector en header ===== */

        .dashboard-selector {
            display: flex;
            align-items: center;
            gap: 10px;
            color: white;
            font-size: 14px;
            font-weight: bold;
        }

        .dashboard-selector select {
            padding: 6px 12px;
            border-radius: 6px;
            border: none;
            background-color: white;
            color: #0033A0;
            font-weight: bold;
            cursor: pointer;
        }

        .dashboard-selector select:focus {
            outline: none;
        }

        /* ===== CONTENEDOR ===== */

        .report-wrapper {
            width: 92%;
            margin: 30px auto;
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.08);
            padding: 20px;
        }

        iframe {
            width: 100%;
            height: 780px;
            border: none;
            border-radius: 8px;
        }

        .report {
            display: none;
        }

        .active {
            display: block;
        }

    </style>
</head>

<body>

<header>
    <!-- Logo izquierda -->
    <img src="hv blanco sin fondo.png" alt="Logo Harinera del Valle" class="logo">

    <!-- Título centrado -->
    <div class="header-title">Portal BI Harinera del Valle</div>

    <!-- Selector derecha -->
    <div class="dashboard-selector">
        <span>Tableros</span>
        <select onchange="showReport(this.value)">
            <option value="r1">Milla Extra</option>
            <option value="r2">Plan Aliados 2025</option>
        </select>
    </div>
</header>

<div class="report-wrapper">
    <div id="r1" class="report active">
        <iframe title="Milla Extra"
            src="https://app.powerbi.com/view?r=eyJrIjoiZWIxN2NkOWYtMjdkZS00MzhlLTkyODctNTNlNTMzZWUzNDY4IiwidCI6IjE1MmFiNmRkLTYzM2QtNDZmZS1iNDY5LTRhN2EzYmUxMGUzZiIsImMiOjR9"
            allowFullScreen="true">
        </iframe>
    </div>

    <div id="r2" class="report">
        <iframe title="HV_Plan Aliados 2025"
            src="https://app.powerbi.com/view?r=eyJrIjoiNzUzMmI3YWItMDkzNy00NGQ5LWIwYWQtNzIzMmJkM2UwOGExIiwidCI6IjE1MmFiNmRkLTYzM2QtNDZmZS1iNDY5LTRhN2EzYmUxMGUzZiIsImMiOjR9"
            allowFullScreen="true">
        </iframe>
    </div>
</div>

<script>
function showReport(id) {
    document.getElementById('r1').classList.remove('active');
    document.getElementById('r2').classList.remove('active');
    document.getElementById(id).classList.add('active');
}
</script>

</body>
</html>
