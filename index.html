<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Portal BI Cliente</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f2f2f2;
        }
        header {
            background-color: #1f4e79;
            color: white;
            padding: 18px;
            text-align: center;
            font-size: 22px;
        }
        .menu {
            text-align: center;
            margin: 20px;
        }
        button {
            padding: 10px 20px;
            margin: 5px;
            cursor: pointer;
            border: none;
            background-color: #1f4e79;
            color: white;
            font-size: 14px;
            border-radius: 5px;
        }
        button:hover {
            background-color: #163a5c;
        }
        iframe {
            width: 100%;
            height: 750px;
            border: none;
        }
        .report {
            display: none;
            width: 95%;
            margin: auto;
        }
        .active {
            display: block;
        }
    </style>
</head>
<body>

<header>Portal BI Cliente</header>

<div class="menu">
    <button onclick="showReport('r1')">Milla Extra</button>
    <button onclick="showReport('r2')">Plan Aliados 2025</button>
</div>

<div id="r1" class="report active">
    <iframe title="Milla Extra"
        src="https://app.powerbi.com/view?r=eyJrIjoiZWIxN2NkOWYtMjdkZS00MzhlLTkyODctNTNlNTMzZWUzNDY4IiwidCI6IjE1MmFiNmRkLTYzM2QtNDZmZS1iNDY5LTRhN2EzYmUxMGUzZiIsImMiOjR9"
        allowFullScreen="true">
    </iframe>
</div>

<div id="r2" class="report">
    <iframe title="HV_Plan Aliados 2025"
        src="https://app.powerbi.com/view?r=eyJrIjoiNzUzMmI3YWItMDkzNy00NGQ5LWIwYWQtNzIzMmJkM2UwOGExIiwidCI6IjE1MmFiNmRkLTYzM2QtNDZmZS1iNDY5LTRhN2EzYmUxMGUzZiIsImMiOjR9"
        allowFullScreen="true">
    </iframe>
</div>

<script>
function showReport(id) {
    document.getElementById('r1').classList.remove('active');
    document.getElementById('r2').classList.remove('active');
    document.getElementById(id).classList.add('active');
}
</script>

</body>
</html>
