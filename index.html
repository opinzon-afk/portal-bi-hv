<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Portal BI Harinera del Valle</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #eef2f7;
        }

        /* ===== HEADER CORPORATIVO ===== */

        header {
            background-color: #0033A0;
            padding: 12px 40px;
            position: relative;
            display: flex;
            align-items: center;
        }

        /* Franja verde inferior */
        header::after {
            content: "";
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 6px;
            background-color: #196B24;
        }

        .logo {
            height: 60px;
        }

        .header-title {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-size: 22px;
            font-weight: bold;
        }

        /* ===== MENU ===== */

        .menu {
            text-align: center;
            margin: 30px;
        }

        button {
            padding: 10px 22px;
            margin: 6px;
            cursor: pointer;
            border: none;
            background-color: #0033A0;
            color: white;
            font-size: 14px;
            border-radius: 6px;
            transition: 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        button:hover {
            opacity: 0.85;
        }

        /* ===== CONTENEDOR TIPO CARD ===== */

        .report-wrapper {
            width: 92%;
            margin: 30px auto;
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.08);
            padding: 20px;
        }

        iframe {
            width: 100%;
            height: 780px;
            border: none;
            border-radius: 8px;
        }

        .report {
            display: none;
        }

        .active {
            display: block;
        }

    </style>
</head>

<body>

<header>
    <img src="hv blanco sin fondo.png" alt="Logo Harinera del Valle" class="logo">
    <div class="header-title">Portal BI Harinera del Valle</div>
</header>

<div class="menu">
    <button onclick="showReport('r1')">Milla Extra</button>
    <button onclick="showReport('r2')">Plan Aliados</button>
</div>

<div class="report-wrapper">
    <div id="r1" class="report active">
        <iframe title="Milla Extra"
            src="https://app.powerbi.com/view?r=eyJrIjoiZWIxN2NkOWYtMjdkZS00MzhlLTkyODctNTNlNTMzZWUzNDY4IiwidCI6IjE1MmFiNmRkLTYzM2QtNDZmZS1iNDY5LTRhN2EzYmUxMGUzZiIsImMiOjR9"
            allowFullScreen="true">
        </iframe>
    </div>

    <div id="r2" class="report">
        <iframe title="HV_Plan Aliados 2025"
            src="https://app.powerbi.com/view?r=eyJrIjoiNzUzMmI3YWItMDkzNy00NGQ5LWIwYWQtNzIzMmJkM2UwOGExIiwidCI6IjE1MmFiNmRkLTYzM2QtNDZmZS1iNDY5LTRhN2EzYmUxMGUzZiIsImMiOjR9"
            allowFullScreen="true">
        </iframe>
    </div>
</div>

<script>
function showReport(id) {
    document.getElementById('r1').classList.remove('active');
    document.getElementById('r2').classList.remove('active');
    document.getElementById(id).classList.add('active');
}
</script>

</body>
</html>
